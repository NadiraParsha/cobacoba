{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Smart Fan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a237e, #534bae);
      color: #fff;
      overflow: hidden;
      position: relative;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .register-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      width: 400px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h3 { margin-bottom: 30px; font-weight: 600; text-align: center; }

    .form-group { margin-bottom: 20px; }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      padding: 12px 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 0.25rem rgba(249, 168, 38, 0.25);
      color: #fff;
    }

    .form-control::placeholder { color: rgba(255, 255, 255, 0.6); }

    .btn-custom {
      background: #f9a826;
      border: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-custom:hover {
      background: #ffb300;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .form-label { font-weight: 500; margin-bottom: 8px; display: block; }

    .link-login {
      text-align: center;
      margin-top: 15px;
      color: #f9a826;
    }

    .link-login a {
      color: #ffb74d;
      text-decoration: none;
      font-weight: 500;
    }

    .link-login a:hover { text-decoration: underline; }

    /* Snowflake */
    .snowflakes { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .snowflake { position: absolute; top: -10px; color: rgba(255, 255, 255, 0.4); font-size: 1.2em; animation: fall linear forwards; user-select: none; }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

    @media (max-width: 480px) {
      .register-box { width: 90%; padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="snowflakes" id="snowflakes"></div>

  <div class="register-box">
    <h3>Smart Fan Register</h3>

    <div id="alertBox" class="d-none"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Masukkan username" required />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Masukkan email aktif" required />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required />
      </div>

      <div class="form-group">
        <label for="password2" class="form-label">Konfirmasi Password</label>
        <input type="password" class="form-control" id="password2" placeholder="Ulangi password" required />
      </div>

      <button type="submit" class="btn btn-custom w-100">Daftar</button>
    </form>

    <div class="link-login">
      Sudah punya akun? <a href="{% url 'login_page' %}">Login di sini</a>
    </div>
  </div>

  <!-- Efek salju -->
  <script>
    function createSnowflakes() {
      const container = document.getElementById("snowflakes");
      const symbols = ["❄", "✦", "❅", "❆"];
      for (let i = 0; i < 50; i++) {
        const s = document.createElement("div");
        s.className = "snowflake";
        s.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        s.style.left = `${Math.random() * 100}vw`;
        s.style.animationDuration = `${10 + Math.random() * 20}s`;
        s.style.animationDelay = `${Math.random() * 5}s`;
        s.style.fontSize = `${0.8 + Math.random() * 1.2}em`;
        s.style.opacity = `${0.3 + Math.random() * 0.4}`;
        container.appendChild(s);
      }
    }
    window.addEventListener("load", createSnowflakes);
  </script>

  <!-- Panggil file JS eksternal -->
  <script src="{% static 'dashboard/js/register.js' %}"></script>
</body>
</html>
